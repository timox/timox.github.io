<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Debug Overlay Diagnostics</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { border: 1px solid #ccc; padding: 15px; margin: 10px 0; }
        .debug-section h3 { margin-top: 0; color: #333; }
        .log { background: #f5f5f5; padding: 10px; margin: 5px 0; border-left: 3px solid #007bff; }
        .error { background: #f8d7da; border-left: 3px solid #dc3545; }
        .warning { background: #fff3cd; border-left: 3px solid #ffc107; }
    </style>
</head>
<body>
    <h1>🔍 Diagnostic des Overlays Bloquants</h1>
    
    <div class="debug-section">
        <h3>Actions d'urgence</h3>
        <button onclick="forceCleanAllOverlays()" style="background: red; color: white; padding: 10px; margin: 5px;">🚨 SUPPRIMER TOUS LES OVERLAYS</button>
        <button onclick="testClickability()" style="background: blue; color: white; padding: 10px; margin: 5px;">🧪 TESTER CLIQUABILITÉ</button>
        <button onclick="highlightOverlays()" style="background: green; color: white; padding: 10px; margin: 5px;">👁️ SURLIGNER OVERLAYS</button>
        <div id="action-results"></div>
    </div>
    
    <div class="debug-section">
        <h3>Overlays Détectés</h3>
        <div id="overlay-analysis"></div>
    </div>
    
    <div class="debug-section">
        <h3>Z-Index Analysis</h3>
        <div id="zindex-analysis"></div>
    </div>
    
    <div class="debug-section">
        <h3>Body State</h3>
        <div id="body-analysis"></div>
    </div>

    <script>
        function analyzeOverlays() {
            const overlayAnalysis = document.getElementById('overlay-analysis');
            const zindexAnalysis = document.getElementById('zindex-analysis');
            const bodyAnalysis = document.getElementById('body-analysis');
            
            // Analyze all potential overlays
            const overlaySelectors = [
                '.modal-backdrop',
                '.comment-edit-widget', 
                '.comment-edit-overlay',
                '[style*="position: fixed"]',
                '[style*="position: absolute"]',
                '.flatpickr-calendar',
                '.modal',
                '[style*="z-index"]'
            ];
            
            let overlayHtml = '';
            let highZIndexElements = [];
            
            overlaySelectors.forEach(selector => {
                const elements = document.querySelectorAll(selector);
                if (elements.length > 0) {
                    elements.forEach((el, index) => {
                        const computedStyle = window.getComputedStyle(el);
                        const zIndex = computedStyle.zIndex;
                        const position = computedStyle.position;
                        const display = computedStyle.display;
                        const visible = display !== 'none' && computedStyle.visibility !== 'hidden';
                        
                        if (visible && zIndex !== 'auto' && parseInt(zIndex) > 1000) {
                            highZIndexElements.push({
                                element: el,
                                selector: selector,
                                zIndex: parseInt(zIndex),
                                position: position,
                                id: el.id || 'no-id',
                                className: el.className
                            });
                        }
                        
                        const className = visible ? 'log warning' : 'log';
                        overlayHtml += `
                            <div class="${className}">
                                <strong>${selector}</strong> [${index + 1}] - 
                                ID: ${el.id || 'none'} - 
                                Display: ${display} - 
                                Position: ${position} - 
                                Z-index: ${zIndex}
                                ${visible ? ' ⚠️ VISIBLE' : ' (hidden)'}
                            </div>
                        `;
                    });
                }
            });
            
            overlayAnalysis.innerHTML = overlayHtml || '<div class="log">✅ Aucun overlay détecté</div>';
            
            // Z-index analysis
            highZIndexElements.sort((a, b) => b.zIndex - a.zIndex);
            let zindexHtml = '';
            highZIndexElements.forEach(item => {
                zindexHtml += `
                    <div class="log ${item.zIndex > 1060 ? 'error' : 'warning'}">
                        Z-index ${item.zIndex}: ${item.selector} (${item.id}) - ${item.position}
                        ${item.zIndex > 1060 ? ' 🚨 BLOQUE LES MODALES' : ''}
                    </div>
                `;
            });
            zindexAnalysis.innerHTML = zindexHtml || '<div class="log">✅ Aucun z-index élevé détecté</div>';
            
            // Body analysis
            const body = document.body;
            bodyAnalysis.innerHTML = `
                <div class="log">Classes: ${body.className}</div>
                <div class="log">Style: ${body.style.cssText}</div>
                <div class="log">Data attributes: ${Array.from(body.attributes).filter(attr => attr.name.startsWith('data')).map(attr => `${attr.name}="${attr.value}"`).join(', ') || 'none'}</div>
            `;
        }
        
        function forceCleanAllOverlays() {
            const results = document.getElementById('action-results');
            let removedCount = 0;
            
            try {
                // Remove all modal backdrops
                document.querySelectorAll('.modal-backdrop').forEach(el => {
                    el.remove();
                    removedCount++;
                });
                
                // Remove comment edit widgets
                document.querySelectorAll('.comment-edit-widget, .comment-edit-overlay').forEach(el => {
                    if (el.style.display !== 'none') {
                        el.style.display = 'none';
                        removedCount++;
                    }
                });
                
                // Hide flatpickr calendars
                document.querySelectorAll('.flatpickr-calendar').forEach(el => {
                    if (el.style.display !== 'none') {
                        el.style.display = 'none';
                        removedCount++;
                    }
                });
                
                // Reset body
                const body = document.body;
                body.classList.remove('modal-open');
                body.style.overflow = '';
                body.style.paddingRight = '';
                body.removeAttribute('data-bs-overflow');
                body.removeAttribute('data-bs-padding-right');
                
                results.innerHTML = `<div class="log">✅ Nettoyage forcé: ${removedCount} overlays supprimés</div>`;
                setTimeout(analyzeOverlays, 100);
            } catch (error) {
                results.innerHTML = `<div class="log error">❌ Erreur nettoyage: ${error.message}</div>`;
            }
        }
        
        function testClickability() {
            const results = document.getElementById('action-results');
            
            // Find history buttons
            const historyButtons = document.querySelectorAll('.btn-history');
            
            if (historyButtons.length === 0) {
                results.innerHTML = '<div class="log error">❌ Aucun bouton .btn-history trouvé</div>';
                return;
            }
            
            let testHtml = `<div class="log">🧪 ${historyButtons.length} boutons .btn-history trouvés</div>`;
            
            historyButtons.forEach((btn, index) => {
                const rect = btn.getBoundingClientRect();
                const elementAtPoint = document.elementFromPoint(rect.left + rect.width/2, rect.top + rect.height/2);
                const isClickable = elementAtPoint === btn || btn.contains(elementAtPoint);
                
                testHtml += `
                    <div class="log ${isClickable ? '' : 'error'}">
                        Bouton ${index + 1}: ${isClickable ? '✅ Cliquable' : '❌ BLOQUÉ'} 
                        - Element au point: ${elementAtPoint?.tagName || 'null'} ${elementAtPoint?.className || ''}
                    </div>
                `;
            });
            
            results.innerHTML = testHtml;
        }
        
        function highlightOverlays() {
            // Add bright red border to all potential blocking elements
            const selectors = ['.modal-backdrop', '.comment-edit-widget', '.comment-edit-overlay', '[style*="z-index"]'];
            
            selectors.forEach(selector => {
                document.querySelectorAll(selector).forEach(el => {
                    const computedStyle = window.getComputedStyle(el);
                    if (computedStyle.display !== 'none') {
                        el.style.border = '5px solid red';
                        el.style.backgroundColor = 'rgba(255, 0, 0, 0.2)';
                    }
                });
            });
            
            setTimeout(() => {
                selectors.forEach(selector => {
                    document.querySelectorAll(selector).forEach(el => {
                        el.style.border = '';
                        el.style.backgroundColor = '';
                    });
                });
            }, 3000);
        }
        
        // Run analysis every 2 seconds
        setInterval(analyzeOverlays, 2000);
        analyzeOverlays();
        
        console.log('🔍 Diagnostic overlay script loaded');
    </script>
</body>
</html>
