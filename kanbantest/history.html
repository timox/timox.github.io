<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historique des Modifications - Kanban SSIR</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- CSS Kanban pour les badges -->
  <link href="css/kanban-responsive.css" rel="stylesheet">
  
  <style>
    .history-card {
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      margin-bottom: 1rem;
    }
    
    .history-card:hover {
      transform: translateY(-2px);
    }
    
    .time-badge {
      font-size: 0.85rem;
      padding: 0.25rem 0.5rem;
    }
    
    .change-type {
      font-size: 0.8rem;
      padding: 0.2rem 0.4rem;
      border-radius: 12px;
    }
    
    .task-title {
      font-weight: 600;
      color: #2c3e50;
    }
    
    .change-details {
      background-color: #f8f9fa;
      border-radius: 6px;
      padding: 0.5rem;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    
    .old-value {
      color: #dc3545;
      text-decoration: line-through;
    }
    
    .new-value {
      color: #198754;
      font-weight: 500;
    }
    
    .loading-spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
    }
    
    .filter-badge {
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .filter-badge:hover {
      transform: scale(1.05);
    }
    
    .filter-badge.active {
      box-shadow: 0 0 0 2px rgba(13, 110, 253, 0.5);
    }
  </style>
</head>

<body class="bg-light">
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-arrow-left me-2"></i>
        Retour au Kanban
      </a>
      <div class="d-flex gap-2">
        <a href="stats.html" class="btn btn-outline-light btn-sm">
          <i class="bi bi-graph-up me-1"></i>
          Statistiques
        </a>
      </div>
      <span class="navbar-text">
        <i class="bi bi-clock-history me-2"></i>
        Historique des Modifications
      </span>
    </div>
  </nav>

  <div class="container-fluid py-4">
    
    <!-- Container d'erreur -->
    <div id="error-container"></div>
    
    <!-- Métriques Rapides -->
    <div class="row mb-4">
      <div class="col-12">
        <h2 class="mb-3">
          <i class="bi bi-clock-history me-2"></i>
          Dernières Modifications
        </h2>
      </div>
      
      <div class="col-lg-3 col-md-6 mb-3">
        <div class="card history-card h-100">
          <div class="card-body text-center">
            <div class="h4 text-primary mb-1" id="today-changes">-</div>
            <div class="text-muted small">Modifications aujourd'hui</div>
          </div>
        </div>
      </div>
      
      <div class="col-lg-3 col-md-6 mb-3">
        <div class="card history-card h-100">
          <div class="card-body text-center">
            <div class="h4 text-success mb-1" id="week-changes">-</div>
            <div class="text-muted small">Cette semaine</div>
          </div>
        </div>
      </div>
      
      <div class="col-lg-3 col-md-6 mb-3">
        <div class="card history-card h-100">
          <div class="card-body text-center">
            <div class="h4 text-info mb-1" id="active-users">-</div>
            <div class="text-muted small">Utilisateurs actifs</div>
          </div>
        </div>
      </div>
      
      <div class="col-lg-3 col-md-6 mb-3">
        <div class="card history-card h-100">
          <div class="card-body text-center">
            <div class="h4 text-warning mb-1" id="total-changes">-</div>
            <div class="text-muted small">Total modifications</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Filtres -->
    <div class="row mb-4">
      <div class="col-12">
        <div class="card history-card">
          <div class="card-body">
            <h5 class="card-title mb-3">
              <i class="bi bi-funnel me-2"></i>
              Filtres
            </h5>
            
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Période</label>
                <select class="form-select" id="period-filter">
                  <option value="today">Aujourd'hui</option>
                  <option value="week">Cette semaine</option>
                  <option value="month">Ce mois</option>
                  <option value="all" selected>Toutes</option>
                </select>
              </div>
              
              <div class="col-md-4">
                <label class="form-label">Type de modification</label>
                <select class="form-select" id="change-type-filter">
                  <option value="all">Tous les types</option>
                  <option value="status">Changement de statut</option>
                  <option value="assignment">Affectation</option>
                  <option value="content">Contenu</option>
                  <option value="creation">Création</option>
                </select>
              </div>
              
              <div class="col-md-4">
                <label class="form-label">Utilisateur</label>
                <select class="form-select" id="user-filter">
                  <option value="all">Tous les utilisateurs</option>
                  <!-- Sera rempli par JS -->
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Liste des modifications -->
    <div class="row">
      <div class="col-12">
        <div class="card history-card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">
              <i class="bi bi-list-ul me-2"></i>
              Historique Détaillé
            </h5>
            <button class="btn btn-outline-primary btn-sm" id="refresh-btn">
              <i class="bi bi-arrow-clockwise me-1"></i>
              Actualiser
            </button>
          </div>
          <div class="card-body p-0">
            <div id="history-list">
              <div class="text-center p-4">
                <div class="loading-spinner">
                  <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Chargement...</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Application History -->
  <script type="module" src="js/history-app.js"></script>
</body>
</html>
