<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Unit Tests</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 960px; margin: 0 auto; padding: 20px;
            background: #f8f9fa; color: #212529;
        }
        h1 { margin-bottom: 16px; }
        .test-summary {
            padding: 14px 20px; border-radius: 6px; margin-bottom: 20px;
            font-size: 15px; color: #fff;
        }
        .test-summary-pass { background: #198754; }
        .test-summary-fail { background: #dc3545; }
        .test-suite { background: #fff; border-radius: 6px; margin-bottom: 12px; padding: 14px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .test-suite-header { font-size: 15px; margin-bottom: 8px; }
        .suite-pass { color: #198754; font-weight: bold; }
        .suite-fail { color: #dc3545; font-weight: bold; }
        .test-list { list-style: none; padding-left: 8px; }
        .test-item { padding: 3px 0; font-size: 13px; }
        .test-status-passed { color: #198754; }
        .test-status-failed { color: #dc3545; font-weight: bold; }
        .test-status-skipped { color: #6c757d; }
        .test-duration { color: #6c757d; }
        .test-error { background: #fff3cd; color: #664d03; padding: 6px 10px; margin-top: 4px; border-radius: 4px; font-size: 12px; white-space: pre-wrap; }
        #results { min-height: 100px; }
        .loading { text-align: center; padding: 40px; color: #6c757d; }
    </style>
</head>
<body>
    <h1>Kanban Unit Tests</h1>
    <div id="results"><div class="loading">Running tests...</div></div>

    <!-- Framework -->
    <script src="test/unit/test-framework.js"></script>

    <!-- Test suites -->
    <script src="test/unit/dom.test.js"></script>
    <script src="test/unit/dates.test.js"></script>
    <script src="test/unit/badges.test.js"></script>
    <script src="test/unit/logger.test.js"></script>
    <script src="test/unit/notes-migrator.test.js"></script>
    <script src="test/unit/grist-helpers.test.js"></script>
    <script src="test/unit/safe-dom.test.js"></script>
    <script src="test/unit/history-parser.test.js"></script>

    <!-- Run -->
    <script>
        (async function () {
            try {
                var results = await TestFramework.runAll();
                TestFramework.renderResults(results, document.getElementById('results'));
                var s = results.summary;
                document.title = (s.failed === 0 ? 'PASS' : 'FAIL') +
                    ' (' + s.passed + '/' + s.total + ') - Kanban Unit Tests';
            } catch (err) {
                document.getElementById('results').innerHTML =
                    '<div class="test-summary test-summary-fail">Fatal error: ' +
                    err.message.replace(/</g, '&lt;') + '</div>';
            }
        })();
    </script>
</body>
</html>
