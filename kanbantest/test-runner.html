<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Unit Tests</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 960px; margin: 0 auto; padding: 20px;
            background: #f8f9fa; color: #212529;
        }
        h1 { margin-bottom: 16px; }
        .test-summary {
            padding: 14px 20px; border-radius: 6px; margin-bottom: 20px;
            font-size: 15px; color: #fff;
        }
        .test-summary-pass { background: #198754; }
        .test-summary-fail { background: #dc3545; }
        .test-suite { background: #fff; border-radius: 6px; margin-bottom: 12px; padding: 14px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .test-suite-header { font-size: 15px; margin-bottom: 8px; }
        .suite-pass { color: #198754; font-weight: bold; }
        .suite-fail { color: #dc3545; font-weight: bold; }
        .test-list { list-style: none; padding-left: 8px; }
        .test-item { padding: 3px 0; font-size: 13px; }
        .test-status-passed { color: #198754; }
        .test-status-failed { color: #dc3545; font-weight: bold; }
        .test-status-skipped { color: #6c757d; }
        .test-duration { color: #6c757d; }
        .test-error { background: #fff3cd; color: #664d03; padding: 6px 10px; margin-top: 4px; border-radius: 4px; font-size: 12px; white-space: pre-wrap; }
        #results { min-height: 100px; }
        .loading { text-align: center; padding: 40px; color: #6c757d; }
    </style>
</head>
<body>
    <h1>Kanban Unit Tests</h1>
    <div id="results"><div class="loading">Running tests...</div></div>

    <!-- Framework (synchronous, must load first) -->
    <script src="test/unit/test-framework.js"></script>

    <!-- Module loader: imports ES module classes, loads test suites, runs tests -->
    <script type="module">
        // Import ES module sub-modules and register globally for test files
        import { ModalJalons } from './js/components/modal/ModalJalons.js';
        import { ModalDatePicker } from './js/components/modal/ModalDatePicker.js';
        import { ModalTaskLinks } from './js/components/modal/ModalTaskLinks.js';
        window.ModalJalons = ModalJalons;
        window.ModalDatePicker = ModalDatePicker;
        window.ModalTaskLinks = ModalTaskLinks;

        // Load test suites sequentially (order matters for registration)
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                s.onerror = () => reject(new Error('Failed to load: ' + src));
                document.body.appendChild(s);
            });
        }

        const testFiles = [
            'test/unit/dom.test.js',
            'test/unit/dates.test.js',
            'test/unit/badges.test.js',
            'test/unit/logger.test.js',
            'test/unit/notes-migrator.test.js',
            'test/unit/grist-helpers.test.js',
            'test/unit/safe-dom.test.js',
            'test/unit/history-parser.test.js',
            'test/unit/modal-jalons.test.js',
            'test/unit/modal-datepicker.test.js',
            'test/unit/modal-tasklinks.test.js',
            'test/unit/history-validator.test.js',
            'test/unit/history-exporter.test.js',
            'test/unit/history-modal-manager.test.js',
            'test/unit/comment-edit-widget.test.js',
            'test/unit/comment-grist-sync.test.js',
            'test/unit/card-renderer.test.js',
            'test/unit/kanban-renderer.test.js',
            'test/unit/column-collapse-manager.test.js',
            'test/unit/modal-reference-data.test.js',
            'test/unit/modal-selects.test.js',
            'test/unit/modal-affectation.test.js',
            'test/unit/modal-strategy.test.js',
            'test/unit/modal-formdata.test.js',
            'test/unit/modal-crud.test.js',
            'test/unit/modal-visuals.test.js',
            'test/unit/modal-history.test.js',
            'test/unit/modal-tabindicators.test.js',
            'test/unit/modal-references.test.js'
        ];

        try {
            for (const file of testFiles) {
                await loadScript(file);
            }

            var results = await TestFramework.runAll();
            TestFramework.renderResults(results, document.getElementById('results'));
            var s = results.summary;
            document.title = (s.failed === 0 ? 'PASS' : 'FAIL') +
                ' (' + s.passed + '/' + s.total + ') - Kanban Unit Tests';
        } catch (err) {
            document.getElementById('results').innerHTML =
                '<div class="test-summary test-summary-fail">Fatal error: ' +
                err.message.replace(/</g, '&lt;') + '</div>';
        }
    </script>
</body>
</html>
