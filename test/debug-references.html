<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Références</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/kanban-responsive.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Debug du système de références</h1>
        
        <div class="row">
            <div class="col-md-6">
                <h3>Simuler une tâche avec références</h3>
                <div class="mb-3">
                    <label>Notes JSON (comme stocké dans Grist):</label>
                    <textarea class="form-control" id="notes-input" rows="10">{
  "content": "Dernier commentaire de test",
  "history": [],
  "references": "https://docs.google.com/document/test\n\\\\serveur\\projets\\migration-AD\\\nGLPI-12345\ncontact.expert@gouv.fr\nDocumentation interne"
}</textarea>
                </div>
                <button class="btn btn-primary" onclick="testReferences()">Tester</button>
            </div>
            
            <div class="col-md-6">
                <h3>Résultat</h3>
                <div class="border p-3 bg-light">
                    <h5>Références extraites:</h5>
                    <div id="extracted-refs"></div>
                    
                    <h5 class="mt-3">Rendu carte:</h5>
                    <div id="card-render"></div>
                    
                    <h5 class="mt-3">Debug:</h5>
                    <pre id="debug" class="bg-dark text-light p-2"></pre>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { referenceManager } from './js/utils/ReferenceManager.js';
        
        window.testReferences = function() {
            const notesInput = document.getElementById('notes-input').value;
            const extractedDiv = document.getElementById('extracted-refs');
            const cardDiv = document.getElementById('card-render');
            const debugDiv = document.getElementById('debug');
            
            try {
                // Parser les notes JSON
                const notesData = JSON.parse(notesInput);
                const referencesText = notesData.references || '';
                
                extractedDiv.innerHTML = `<code>${referencesText.replace(/\n/g, '<br>')}</code>`;
                
                // Générer le rendu carte
                const cardHtml = referenceManager.generateCardHtml(referencesText);
                cardDiv.innerHTML = cardHtml || '<em>Aucune référence</em>';
                
                // Debug
                const parsed = referenceManager.parseReferences(referencesText);
                debugDiv.textContent = JSON.stringify({
                    notesData,
                    referencesText,
                    parsed
                }, null, 2);
                
            } catch (error) {
                debugDiv.textContent = 'Erreur: ' + error.message;
            }
        };
        
        // Test initial
        window.testReferences();
    </script>
</body>
</html>
