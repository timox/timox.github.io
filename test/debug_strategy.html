<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Strategy Icon Issue</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { border: 1px solid #ccc; padding: 15px; margin: 10px 0; }
        .debug-section h3 { margin-top: 0; color: #333; }
        .log { background: #f5f5f5; padding: 10px; margin: 5px 0; border-left: 3px solid #007bff; }
        .test-case { background: #fff3cd; padding: 10px; margin: 10px 0; border-left: 3px solid #ffc107; }
    </style>
</head>
<body>
    <h1>Debug Strategy Icon Generation - VERSION CORRIGÉE (Format Grist ["L", number])</h1>
    
    <div class="debug-section">
        <h3>Test Strategy Data Structure</h3>
        <div id="strategy-data-test"></div>
    </div>
    
    <div class="debug-section">
        <h3>Test getMultipleStrategiesInfo Function</h3>
        <div id="strategy-function-test"></div>
    </div>
    
    <div class="debug-section">
        <h3>Test Strategy Icon Generation</h3>
        <div id="strategy-icon-test"></div>
    </div>

    <script type="module">
        // Import the constants
        import { STRATEGY_DATA } from '../kanban/js/config/constants.js';
        
        console.log('🔧 Debug script démarré');
        
        // Test 1: Verify strategy data structure
        function testStrategyData() {
            const output = document.getElementById('strategy-data-test');
            
            if (!STRATEGY_DATA || !Array.isArray(STRATEGY_DATA)) {
                output.innerHTML = '<div class="log">❌ STRATEGY_DATA is not available or not an array</div>';
                return false;
            }
            
            output.innerHTML = `
                <div class="log">✅ STRATEGY_DATA loaded: ${STRATEGY_DATA.length} strategies</div>
                <div class="log">📊 First strategy: ${JSON.stringify(STRATEGY_DATA[0], null, 2)}</div>
                <div class="log">🔍 Strategy IDs: ${STRATEGY_DATA.map(s => s.id).slice(0, 10).join(', ')}...</div>
            `;
            return true;
        }
        
        // Test 2: Simulate getMultipleStrategiesInfo function (VERSION CORRIGÉE test/)
        function simulateGetMultipleStrategiesInfo(strategieIds) {
            console.log(`🔍 simulateGetMultipleStrategiesInfo called with:`, {
                strategieIds,
                type: typeof strategieIds,
                isArray: Array.isArray(strategieIds)
            });
            
            if (!strategieIds || !STRATEGY_DATA) {
                console.log(`❌ Early return: strategieIds=${strategieIds}, STRATEGY_DATA=${!!STRATEGY_DATA}`);
                return [];
            }
            
            // 🔧 CORRECTION: Grist renvoie les IDs sous format ["L", number]
            let cleanIds = strategieIds;
            
            // Si c'est un array Grist ["L", id], extraire l'ID
            if (Array.isArray(strategieIds) && strategieIds.length === 2 && strategieIds[0] === 'L') {
                cleanIds = strategieIds[1];
                console.log(`🔄 Grist format detected: ${JSON.stringify(strategieIds)} → extracted: ${cleanIds}`);
            }
            
            // Support ancien format (single ID) et nouveau format (array)
            const idsArray = Array.isArray(cleanIds) ? cleanIds : [cleanIds];
            console.log(`🔄 IDs to process:`, idsArray);
            
            const result = idsArray
                .map(id => {
                    // 🔧 CORRECTION: Comparaison flexible pour gérer string/number depuis Grist
                    const found = STRATEGY_DATA.find(strategy => strategy.id == id); // == au lieu de ===
                    console.log(`🔎 Search ID ${id}:`, found ? `Found: ${found.objectif}` : 'Not found');
                    return found;
                })
                .filter(strategy => strategy !== undefined);
            
            console.log(`✅ Final result:`, result);
            return result;
        }
        
        // Test 3: Test different strategy ID scenarios
        function testStrategyFunction() {
            const output = document.getElementById('strategy-function-test');
            const testCases = [
                { name: 'null', value: null },
                { name: 'undefined', value: undefined },
                { name: 'empty string', value: '' },
                { name: 'zero', value: 0 },
                { name: 'valid ID (1)', value: 1 },
                { name: 'valid ID (5)', value: 5 },
                { name: 'invalid ID (999)', value: 999 },
                { name: 'string ID ("1")', value: "1" },
                { name: 'array with valid ID', value: [1] },
                { name: 'array with multiple IDs', value: [1, 5, 10] },
                // 🆕 TESTS FORMAT GRIST
                { name: 'Grist format ["L", 1]', value: ["L", 1] },
                { name: 'Grist format ["L", 5]', value: ["L", 5] },
                { name: 'Grist format ["L", 11]', value: ["L", 11] },
                { name: 'Grist format ["L", "7"]', value: ["L", "7"] },
                { name: 'Grist invalid ["L", 999]', value: ["L", 999] },
                { name: 'Malformed ["X", 1]', value: ["X", 1] }
            ];
            
            let html = '';
            testCases.forEach(testCase => {
                const result = simulateGetMultipleStrategiesInfo(testCase.value);
                const iconWouldShow = result.length > 0;
                
                html += `
                    <div class="test-case">
                        <strong>${testCase.name}:</strong> ${JSON.stringify(testCase.value)} 
                        → Results: ${result.length} 
                        → Icon: ${iconWouldShow ? '✅ YES' : '❌ NO'}
                        ${result.length > 0 ? `<br>Found: ${result.map(s => s.objectif).join(', ')}` : ''}
                    </div>
                `;
            });
            
            output.innerHTML = html;
        }
        
        // Test 4: Test icon generation
        function testIconGeneration() {
            const output = document.getElementById('strategy-icon-test');
            
            // Simulate different scenarios
            const scenarios = [
                { name: 'Task with no strategy', strategie_id: null },
                { name: 'Task with strategy ID 1', strategie_id: 1 },
                { name: 'Task with strategy ID 5', strategie_id: 5 },
                { name: 'Task with invalid strategy', strategie_id: 999 },
                { name: 'Task with string strategy', strategie_id: "1" },
                { name: 'Task with array strategy', strategie_id: [1, 5] },
                // 🆕 TESTS FORMAT GRIST RÉEL
                { name: 'Task Grist format ["L", 7]', strategie_id: ["L", 7] },
                { name: 'Task Grist format ["L", 11]', strategie_id: ["L", 11] },
                { name: 'Task Grist format ["L", "24"]', strategie_id: ["L", "24"] }
            ];
            
            let html = '';
            scenarios.forEach(scenario => {
                const strategiesInfo = simulateGetMultipleStrategiesInfo(scenario.strategie_id);
                const strategiesText = strategiesInfo.length > 0 
                    ? strategiesInfo.map(s => `${s.objectif} → ${s.action}`).join(' | ')
                    : '';
                const strategyTooltip = strategiesText ? 
                    `data-toggle="tooltip" data-placement="top" title="Stratégies: ${strategiesText}"` : '';
                const strategyIcon = strategiesInfo.length > 0 ? 
                    `<i class="fas fa-bullseye strategie-icon" ${strategyTooltip}></i>` : '';
                
                html += `
                    <div class="test-case">
                        <strong>${scenario.name}:</strong><br>
                        Input: ${JSON.stringify(scenario.strategie_id)}<br>
                        Strategies found: ${strategiesInfo.length}<br>
                        Icon HTML: <code>${strategyIcon || '(empty)'}</code><br>
                        ${strategyIcon ? `Preview: ${strategyIcon}` : ''}
                    </div>
                `;
            });
            
            output.innerHTML = html;
        }
        
        // Run all tests
        if (testStrategyData()) {
            testStrategyFunction();
            testIconGeneration();
        }
    </script>
</body>
</html>
