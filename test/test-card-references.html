<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Références dans Carte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/kanban.css" rel="stylesheet">
    <link href="css/kanban-responsive.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Test d'affichage des références dans une carte</h1>
        
        <div class="row">
            <div class="col-md-6">
                <h3>Carte simulée avec références</h3>
                <div class="kanban-board">
                    <div class="kanban-board-body">
                        <!-- Carte de test -->
                        <div class="kanban-item kanban-item-detailed" data-id="999">
                            <div class="drag-handle">
                                <i class="bi bi-grip-vertical"></i>
                            </div>
                            
                            <div class="item-title">Tâche de test avec références</div>
                            
                            <!-- Test direct du HTML des références -->
                            <div class="references-container">
                                <a href="https://docs.google.com" target="_blank" class="reference-badge type-url">
                                    <i class="bi bi-globe"></i>
                                    docs.google.com
                                </a>
                                <a href="mailto:test@example.com" target="_blank" class="reference-badge type-email">
                                    <i class="bi bi-envelope"></i>
                                    test@example.com
                                </a>
                                <a href="#" class="reference-badge type-reference">
                                    <i class="bi bi-hash"></i>
                                    GLPI-12345
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <h3>HTML généré dynamiquement</h3>
                <div id="dynamic-test" class="border p-3"></div>
                
                <h3 class="mt-3">Debug</h3>
                <pre id="debug" class="bg-dark text-light p-2"></pre>
            </div>
        </div>
    </div>

    <script type="module">
        import { referenceManager } from './js/utils/ReferenceManager.js';
        import { CardRenderer } from './js/renderers/CardRenderer.js';
        
        // Test avec le référenceManager
        const testRefs = `https://docs.google.com
test@example.com
GLPI-12345
\\\\serveur\\dossier\\fichier.pdf`;
        
        const cardHtml = referenceManager.generateCardHtml(testRefs);
        document.getElementById('dynamic-test').innerHTML = cardHtml;
        
        // Test avec une tâche complète
        const testTask = {
            id: 999,
            titre: "Tâche de test",
            notes: JSON.stringify({
                content: "Test",
                history: [],
                references: testRefs
            })
        };
        
        // Créer un renderer pour tester
        const renderer = new CardRenderer({ currentRecords: [testTask] });
        const refsHtml = renderer.generateReferencesHtml(testTask);
        
        document.getElementById('debug').textContent = JSON.stringify({
            testRefs,
            cardHtml,
            refsHtml,
            parsedRefs: referenceManager.parseReferences(testRefs)
        }, null, 2);
    </script>
</body>
</html>
