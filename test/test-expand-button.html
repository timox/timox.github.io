<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Bouton Expansion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/kanban.css" rel="stylesheet">
    <link href="css/kanban-base.css" rel="stylesheet">
    <link href="css/kanban-responsive.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Test du bouton d'expansion des cartes</h1>
        
        <div class="row">
            <div class="col-md-6">
                <h3>Carte compacte avec bouton expand</h3>
                
                <div class="kanban-container kanban-compact">
                    <div class="kanban-board">
                        <div class="kanban-board-body" id="test-container">
                            <!-- Le contenu sera généré par JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <h3>Debug</h3>
                <div id="debug-info" class="border p-3 bg-light">
                    <p>Cliquez sur le bouton ▼ pour tester l'expansion</p>
                </div>
                
                <h3 class="mt-3">Test CSS direct</h3>
                <button class="btn-expand" title="Test">
                    <i class="bi bi-chevron-down"></i>
                </button>
                <p>↑ Ce bouton devrait être visible avec un style gris</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { CardRenderer } from './js/renderers/CardRenderer.js';
        
        // Créer une tâche de test
        const testTask = {
            id: 999,
            titre: "Tâche de test avec références",
            statut: "À faire",
            urgence: "Immédiate",
            impact: "Important",
            bureau: ["SSIR"],
            projet: "Test",
            notes: JSON.stringify({
                content: "Commentaire de test",
                history: [],
                references: "https://docs.google.com\nGLPI-12345\ntest@example.com"
            })
        };
        
        // Créer un mock kanbanManager minimal
        const mockKanbanManager = {
            currentRecords: [testTask],
            refreshKanban: () => console.log("Refresh kanban called")
        };
        
        // Créer le renderer
        const cardRenderer = new CardRenderer(mockKanbanManager);
        
        // Générer le HTML de la carte
        const cardHtml = cardRenderer.renderTaskCard(testTask, 'compact');
        console.log('Generated card HTML:', cardHtml);
        
        // Injecter dans le conteneur
        const container = document.getElementById('test-container');
        container.innerHTML = cardHtml;
        
        // Attacher les événements
        cardRenderer.attachCardEventListeners(container);
        
        // Debug
        const debugDiv = document.getElementById('debug-info');
        debugDiv.innerHTML = `
            <p><strong>HTML généré :</strong></p>
            <pre style="font-size: 0.8rem; white-space: pre-wrap;">${cardHtml.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>
            
            <p><strong>Bouton trouvé :</strong> ${container.querySelector('.btn-expand') ? 'OUI' : 'NON'}</p>
            <p><strong>Référence indicateur :</strong> ${container.querySelector('.references-indicator') ? 'OUI' : 'NON'}</p>
            
            <p><strong>Événements attachés :</strong> Check console pour les clics</p>
        `;
        
        // Test d'expansion programmatique
        window.testExpand = function() {
            console.log('Test expansion...');
            cardRenderer.expandCard(999);
        };
        
        // Test de collapse programmatique
        window.testCollapse = function() {
            console.log('Test collapse...');
            cardRenderer.collapseCard(999);
        };
        
        console.log('Test page loaded. Use testExpand() and testCollapse() in console');
    </script>
    
    <div class="fixed-bottom bg-light p-2 border-top">
        <small>
            <strong>Tests :</strong> 
            <button onclick="testExpand()" class="btn btn-sm btn-outline-primary">Expand</button>
            <button onclick="testCollapse()" class="btn btn-sm btn-outline-secondary">Collapse</button>
            Vérifiez la console pour les logs
        </small>
    </div>
</body>
</html>
