<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Références</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/kanban-responsive.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Test du système de références</h1>
        
        <div class="row">
            <div class="col-md-6">
                <h3>Saisie</h3>
                <textarea class="form-control" id="test-references" rows="6" placeholder="Entrez vos références, une par ligne">https://docs.google.com/document/test
\\serveur\projets\migration-AD\
GLPI-12345
contact.expert@gouv.fr
Documentation interne</textarea>
            </div>
            
            <div class="col-md-6">
                <h3>Aperçu</h3>
                <div id="test-preview" class="border p-3 bg-light"></div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <h3>Aperçu format carte</h3>
                <div id="card-preview" class="border p-3"></div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <h3>Debug</h3>
                <pre id="debug-output" class="bg-dark text-light p-3"></pre>
            </div>
        </div>
    </div>

    <script type="module">
        import { referenceManager } from './js/utils/ReferenceManager.js';
        
        const textarea = document.getElementById('test-references');
        const preview = document.getElementById('test-preview');
        const cardPreview = document.getElementById('card-preview');
        const debugOutput = document.getElementById('debug-output');
        
        function updatePreviews() {
            const text = textarea.value;
            
            // Aperçu modal
            const modalHtml = referenceManager.generatePreviewHtml(text);
            preview.innerHTML = modalHtml;
            
            // Aperçu carte
            const cardHtml = referenceManager.generateCardHtml(text);
            cardPreview.innerHTML = cardHtml;
            
            // Debug
            const parsed = referenceManager.parseReferences(text);
            debugOutput.textContent = JSON.stringify(parsed, null, 2);
        }
        
        textarea.addEventListener('input', updatePreviews);
        
        // Test initial
        updatePreviews();
    </script>
</body>
</html>
