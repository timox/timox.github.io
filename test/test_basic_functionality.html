<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tests Basiques - Kanban SSIR</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { border: 1px solid #ddd; margin: 10px 0; padding: 15px; }
        .test-passed { background-color: #d4edda; border-color: #c3e6cb; }
        .test-failed { background-color: #f8d7da; border-color: #f5c6cb; }
        .test-pending { background-color: #fff3cd; border-color: #ffeaa7; }
        h2 { margin-top: 0; }
        .test-button { margin: 5px; padding: 8px 15px; cursor: pointer; }
        #results { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🧪 Tests Automatisés - Kanban SSIR</h1>
    
    <div class="test-section">
        <h2>Tests de Stabilité</h2>
        <button class="test-button" onclick="testHistoryManagerFocus()">Test Focus HistoryManager</button>
        <button class="test-button" onclick="testModalSystem()">Test Système Modal</button>
        <button class="test-button" onclick="testJQueryStandardization()">Test Standardisation jQuery</button>
    </div>
    
    <div class="test-section">
        <h2>Tests Fonctionnels</h2>
        <button class="test-button" onclick="testFiltering()">Test Filtres</button>
        <button class="test-button" onclick="testFormReset()">Test Reset Formulaires</button>
        <button class="test-button" onclick="testCommentEditing()">Test Édition Commentaires</button>
        <button class="test-button" onclick="testJalonPropagation()">Test Propagation Jalons</button>
        <button class="test-button" onclick="testStrategiesPropagation()">Test Propagation Stratégies</button>
    </div>
    
    <div class="test-section">
        <h2>Tests de Performance</h2>
        <button class="test-button" onclick="testLoadingSpeed()">Test Vitesse Chargement</button>
        <button class="test-button" onclick="testMemoryLeaks()">Test Fuites Mémoire</button>
    </div>
    
    <button onclick="runAllTests()" style="background: #007bff; color: white; padding: 10px 20px; font-size: 16px; margin: 20px 0;">
        🚀 Lancer Tous les Tests
    </button>
    
    <div id="results"></div>

    <script>
        let testResults = [];
        
        function logTest(testName, status, details = '') {
            const timestamp = new Date().toLocaleTimeString();
            testResults.push({ testName, status, details, timestamp });
            updateResults();
        }
        
        function updateResults() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<h3>📊 Résultats des Tests</h3>';
            
            testResults.forEach(result => {
                const className = result.status === 'PASSED' ? 'test-passed' : 
                                result.status === 'FAILED' ? 'test-failed' : 'test-pending';
                                
                resultsDiv.innerHTML += `
                    <div class="test-section ${className}">
                        <strong>${result.testName}</strong> - ${result.status}
                        <br><small>${result.timestamp}: ${result.details}</small>
                    </div>
                `;
            });
        }
        
        // Tests individuels
        function testHistoryManagerFocus() {
            logTest('HistoryManager Focus', 'RUNNING', 'Vérification absence retry logic...');
            
            try {
                // Simuler l'ouverture d'un widget d'édition
                const testTextarea = document.createElement('textarea');
                testTextarea.id = 'test-focus-textarea';
                document.body.appendChild(testTextarea);
                
                // Test de focus direct (simulé)
                testTextarea.focus();
                const hasFocus = document.activeElement === testTextarea;
                
                document.body.removeChild(testTextarea);
                
                if (hasFocus) {
                    logTest('HistoryManager Focus', 'PASSED', 'Focus direct fonctionne sans retry');
                } else {
                    logTest('HistoryManager Focus', 'FAILED', 'Focus direct échoué');
                }
            } catch (error) {
                logTest('HistoryManager Focus', 'FAILED', error.message);
            }
        }
        
        function testModalSystem() {
            logTest('Système Modal', 'RUNNING', 'Vérification absence scripts d\'urgence...');
            
            // Vérifier que les scripts d'urgence n'existent plus
            const emergencyScripts = [
                'fix_all_modals_emergency.js',
                'debug_modal_reality.js',
                'fix_immediate.js'
            ];
            
            let foundEmergencyScripts = 0;
            emergencyScripts.forEach(script => {
                const scriptExists = document.querySelector(`script[src*="${script}"]`);
                if (scriptExists) foundEmergencyScripts++;
            });
            
            if (foundEmergencyScripts === 0) {
                logTest('Système Modal', 'PASSED', 'Aucun script d\'urgence détecté');
            } else {
                logTest('Système Modal', 'FAILED', `${foundEmergencyScripts} scripts d'urgence encore présents`);
            }
        }
        
        function testJQueryStandardization() {
            logTest('Standardisation jQuery', 'RUNNING', 'Vérification utilisation jQuery...');
            
            // Vérifier que jQuery est disponible
            if (typeof $ !== 'undefined') {
                // Test simple de sélection jQuery
                const testDiv = $('<div id="jquery-test">Test</div>').appendTo('body');
                const found = $('#jquery-test').length > 0;
                testDiv.remove();
                
                if (found) {
                    logTest('Standardisation jQuery', 'PASSED', 'jQuery fonctionne correctement');
                } else {
                    logTest('Standardisation jQuery', 'FAILED', 'Sélection jQuery échouée');
                }
            } else {
                logTest('Standardisation jQuery', 'FAILED', 'jQuery non disponible');
            }
        }
        
        function testFiltering() {
            logTest('Système de Filtres', 'PENDING', 'Test nécessite l\'application complète');
        }
        
        function testFormReset() {
            logTest('Reset Formulaires', 'RUNNING', 'Test reset intelligent...');
            
            // Créer un formulaire de test
            const form = $(`
                <form id="test-form">
                    <input type="text" value="test" />
                    <select><option value="option1" selected>Option 1</option></select>
                </form>
            `).appendTo('body');
            
            // Test reset
            form[0].reset();
            const inputEmpty = form.find('input').val() === '';
            
            form.remove();
            
            if (inputEmpty) {
                logTest('Reset Formulaires', 'PASSED', 'Reset fonctionne correctement');
            } else {
                logTest('Reset Formulaires', 'FAILED', 'Reset n\'a pas vidé les champs');
            }
        }
        
        function testCommentEditing() {
            logTest('Édition Commentaires', 'PENDING', 'Test nécessite l\'application complète');
        }
        
        function testJalonPropagation() {
            logTest('Propagation Jalons', 'RUNNING', 'Test isolation des jalons entre tâches...');
            
            try {
                // Simuler le test de propagation des jalons
                // Créer un container de test pour jalons
                const jalonContainer = $('<div class="jalons-list test-container"></div>').appendTo('body');
                
                // Test 1: Ajouter des jalons simulés
                jalonContainer.html('<div class="jalon-item">Test Jalon 1</div><div class="jalon-item">Test Jalon 2</div>');
                const initialJalons = jalonContainer.find('.jalon-item').length;
                
                // Test 2: Simuler le nettoyage (comme dans resetTaskForm)
                jalonContainer.html('');
                const afterCleanup = jalonContainer.find('.jalon-item').length;
                
                // Test 3: Vérifier que le container existe mais est vide
                const containerExists = $('.jalons-list.test-container').length > 0;
                const isEmpty = afterCleanup === 0;
                
                // Nettoyage
                jalonContainer.remove();
                
                if (containerExists && isEmpty && initialJalons === 2) {
                    logTest('Propagation Jalons', 'PASSED', 'Nettoyage DOM des jalons fonctionne');
                } else {
                    logTest('Propagation Jalons', 'FAILED', `Container: ${containerExists}, Vide: ${isEmpty}, Initial: ${initialJalons}`);
                }
            } catch (error) {
                logTest('Propagation Jalons', 'FAILED', error.message);
            }
        }
        
        function testStrategiesPropagation() {
            logTest('Propagation Stratégies', 'RUNNING', 'Test isolation des stratégies entre tâches...');
            
            try {
                // Simuler le test de propagation des stratégies
                // Créer un container de test pour stratégies
                const strategiesContainer = $('<div class="strategies-list test-container"></div>').appendTo('body');
                
                // Test 1: Ajouter des stratégies simulées
                strategiesContainer.html('<div class="strategy-item">Stratégie A</div><div class="strategy-item">Stratégie B</div>');
                const initialStrategies = strategiesContainer.find('.strategy-item').length;
                
                // Test 2: Simuler le nettoyage (comme dans resetTaskForm)
                strategiesContainer.html('');
                const afterCleanup = strategiesContainer.find('.strategy-item').length;
                
                // Test 3: Vérifier que le container existe mais est vide
                const containerExists = $('.strategies-list.test-container').length > 0;
                const isEmpty = afterCleanup === 0;
                
                // Nettoyage
                strategiesContainer.remove();
                
                if (containerExists && isEmpty && initialStrategies === 2) {
                    logTest('Propagation Stratégies', 'PASSED', 'Nettoyage DOM des stratégies fonctionne');
                } else {
                    logTest('Propagation Stratégies', 'FAILED', `Container: ${containerExists}, Vide: ${isEmpty}, Initial: ${initialStrategies}`);
                }
            } catch (error) {
                logTest('Propagation Stratégies', 'FAILED', error.message);
            }
        }
        
        function testLoadingSpeed() {
            logTest('Vitesse Chargement', 'RUNNING', 'Mesure du temps de chargement...');
            
            const startTime = performance.now();
            
            // Simuler du chargement
            setTimeout(() => {
                const endTime = performance.now();
                const loadTime = endTime - startTime;
                
                if (loadTime < 1000) {
                    logTest('Vitesse Chargement', 'PASSED', `Chargement en ${loadTime.toFixed(2)}ms`);
                } else {
                    logTest('Vitesse Chargement', 'FAILED', `Chargement lent: ${loadTime.toFixed(2)}ms`);
                }
            }, 100);
        }
        
        function testMemoryLeaks() {
            logTest('Fuites Mémoire', 'RUNNING', 'Vérification event listeners...');
            
            // Test simple de création/suppression d'éléments
            const initialElements = document.querySelectorAll('*').length;
            
            // Créer et supprimer des éléments
            for (let i = 0; i < 100; i++) {
                const div = document.createElement('div');
                document.body.appendChild(div);
                document.body.removeChild(div);
            }
            
            const finalElements = document.querySelectorAll('*').length;
            
            if (finalElements <= initialElements + 5) {
                logTest('Fuites Mémoire', 'PASSED', 'Pas de fuite détectée');
            } else {
                logTest('Fuites Mémoire', 'FAILED', `${finalElements - initialElements} éléments non nettoyés`);
            }
        }
        
        function runAllTests() {
            testResults = []; // Reset
            logTest('Suite de Tests', 'RUNNING', 'Lancement de tous les tests...');
            
            testHistoryManagerFocus();
            testModalSystem();
            testJQueryStandardization();
            testFiltering();
            testFormReset();
            testCommentEditing();
            testJalonPropagation();
            testStrategiesPropagation();
            testLoadingSpeed();
            testMemoryLeaks();
            
            setTimeout(() => {
                const passed = testResults.filter(r => r.status === 'PASSED').length;
                const failed = testResults.filter(r => r.status === 'FAILED').length;
                const pending = testResults.filter(r => r.status === 'PENDING').length;
                
                logTest('Résumé Final', 'COMPLETED', 
                    `✅ ${passed} réussis, ❌ ${failed} échoués, ⏳ ${pending} en attente`);
            }, 1000);
        }
        
        // Lancer un test de base au chargement
        document.addEventListener('DOMContentLoaded', () => {
            logTest('Système de Tests', 'PASSED', 'Framework de tests initialisé');
        });
    </script>
</body>
</html>
