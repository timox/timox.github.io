<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test Modal Buttons</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Test Modal Buttons</h1>
    <button type="button" class="btn btn-primary" id="test-open-modal">Ouvrir Modal Test</button>
    
    <!-- Modal Test -->
    <div class="modal fade" id="popup-tache" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Test Modal</h5>
          </div>
          <div class="modal-body">
            <p>Test des boutons:</p>
            <button type="button" class="btn btn-success" id="btn-save-task">Sauvegarder</button>
            <button type="button" class="btn btn-danger" id="btn-delete-task">Supprimer</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Test simple des event listeners jQuery
    $(document).ready(function() {
      console.log('Test page loaded');
      
      // Ouvrir la modal
      $('#test-open-modal').click(function() {
        const modal = new bootstrap.Modal(document.getElementById('popup-tache'));
        modal.show();
      });
      
      // Event listeners avec jQuery delegation (comme dans ModalManager)
      $(document).off('click.modal-events', '#btn-save-task, #btn-delete-task')
        .on('click.modal-events', '#btn-save-task', function(e) {
          e.preventDefault();
          e.stopPropagation();
          console.log('✅ Save button clicked!');
          alert('Save button works!');
        })
        .on('click.modal-events', '#btn-delete-task', function(e) {
          e.preventDefault(); 
          e.stopPropagation();
          console.log('✅ Delete button clicked!');
          alert('Delete button works!');
        });
      
      console.log('Event listeners attached');
    });
  </script>
</body>
</html>
